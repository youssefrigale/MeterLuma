[package]
name = "meterluma"
version = "0.1.2"
description = "All your AI usage, one glance."
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "meterluma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The release workflow enables this, with a --config overlay for plugins.updater, only when updater keys exist.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# Windows updates use the NSIS .exe directly; macOS uses .app.tar.gz.
# Keep TLS/proxy support without the plugin's unused Windows ZIP extractor.
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.23.1"
dirs = "6"
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }
wait-timeout = "0.2"

