[package]
name = "meterluma"
version = "0.1.0"
description = "All your AI usage, one glance."
edition = "2021"

[lib]
name = "meterluma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

