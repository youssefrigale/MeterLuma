[package]
name = "meterluma"
version = "0.1.3"
description = "All your AI usage, one glance."
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "meterluma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The release workflow enables this, with a --config overlay for plugins.updater, only when updater keys exist.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
codegen-units = 1
lto = true
strip = true

# Local builds scan multi-gigabyte usage logs too; optimize the app without rebuilding dependencies.
[profile.dev.package.meterluma]
opt-level = 2

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# Windows updates use the NSIS .exe directly; macOS uses .app.tar.gz.
# Keep TLS/proxy support without the plugin's unused Windows ZIP extractor.
tauri-plugin-updater = { version = "2", optional = true, default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "system-proxy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.23.1"
minisign-verify = "0.3"
dirs = "6"
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }
wait-timeout = "0.2"
zstd = { version = "0.14.3", default-features = false }
quick-xml = "0.42.0"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

# Already used by tauri-plugin-dialog; shown directly when the app fails before its window exists.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSError", "NSObject", "NSDictionary", "NSUserDefaults", "NSValue"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSView", "NSWindow", "NSButton", "NSControl", "NSCell", "NSFont", "NSImage", "NSStatusItem", "NSStatusBarButton", "NSScreen", "objc2-core-foundation", "objc2-quartz-core"] }

