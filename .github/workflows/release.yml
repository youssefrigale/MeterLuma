name: Release MeterLuma

# Builds release candidates only from a clean, tagged commit. Every signing step is skipped when its
# secrets are absent, and fails loudly when they are only partly configured. See docs/release-process.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build again, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meterluma-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag, versions and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
      clean: ${{ steps.verify.outputs.clean }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json, Cargo.toml and tauri.conf.json; tree is clean
        id: verify
        run: node .github/scripts/release-meta.mjs verify "$RELEASE_TAG"
      - name: Third-party notices cover every locked package
        run: node .github/scripts/release-meta.mjs notices
      - run: npm ci
      - name: Type-check and build the release frontend
        run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Chromium tests (dev server)
        run: npm test -- --reporter=list,json --output=test-results/chromium
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/pw-chromium.json
      - name: Release-build tests (vite preview of dist)
        run: npm run test:release -- --reporter=list,json --output=test-results/release
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/pw-release.json
      - name: WebKit tests
        run: npm run test:webkit -- --reporter=list,json --output=test-results/webkit
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/pw-webkit.json
      - name: Summarize interface tests
        run: node .github/scripts/release-meta.mjs tests "$RUNNER_TEMP/interface-tests/interface-tests.json" "chromium=$RUNNER_TEMP/pw-chromium.json" "release=$RUNNER_TEMP/pw-release.json" "webkit=$RUNNER_TEMP/pw-webkit.json"
      - uses: actions/upload-artifact@v7
        with:
          name: meterluma-interface-tests
          path: ${{ runner.temp }}/interface-tests/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-browser-test-results
          path: test-results/
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos
            runner: macos-latest
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No Rust build cache here: release binaries are compiled from scratch.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.rust_targets }}
      - run: npm ci
      - name: Build the frontend for native tests
        run: npm run build
      - name: Native tests (host)
        shell: bash
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --locked 2>&1 | tee "$RUNNER_TEMP/native-host.log"
      - name: Native tests (Intel slice under Rosetta)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then sudo softwareupdate --install-rosetta --agree-to-license; fi
          cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target x86_64-apple-darwin --locked 2>&1 | tee "$RUNNER_TEMP/native-x86_64.log"
      - name: Summarize native tests
        shell: bash
        run: |
          specs=("host=$RUNNER_TEMP/native-host.log")
          if [ "$PLATFORM" = macos ]; then specs+=("x86_64=$RUNNER_TEMP/native-x86_64.log"); fi
          node .github/scripts/release-meta.mjs tests "$RUNNER_TEMP/native-tests.json" "${specs[@]}"

      - name: Detect signing and updater configuration
        id: signing
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY != '' }}
          HAS_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY != '' }}
          HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          HAS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' }}
          HAS_AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_METERLUMA_UPDATER_PUBKEY: ${{ secrets.METERLUMA_UPDATER_PUBKEY != '' }}
          HAS_METERLUMA_UPDATER_ENDPOINT: ${{ secrets.METERLUMA_UPDATER_ENDPOINT != '' }}
        run: |
          state() { local count=0 name flag; for name in "$@"; do flag="HAS_$name"; if [ "${!flag}" = true ]; then count=$((count + 1)); fi; done; if [ "$count" -eq "$#" ]; then echo all; elif [ "$count" -eq 0 ]; then echo none; else echo partial; fi; }
          partial() { local missing=() name flag; for name in "${@:2}"; do flag="HAS_$name"; if [ "${!flag}" != true ]; then missing+=("$name"); fi; done; echo "::error::$1 is only partly configured. Missing: ${missing[*]}. Add them, or remove the others to build without it."; exit 1; }
          apple_sign=false; apple_notarize=none; windows_sign=none; updater=false
          if [ "$PLATFORM" = macos ]; then
            cert=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY); id=(APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID); api=(APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY)
            cert_state=$(state "${cert[@]}"); id_state=$(state "${id[@]}"); api_state=$(state "${api[@]}")
            if [ "$cert_state" = partial ]; then partial "Apple code signing" "${cert[@]}"; fi
            if [ "$id_state" = partial ]; then partial "Apple ID notarization" "${id[@]}"; fi
            if [ "$api_state" = partial ]; then partial "App Store Connect API notarization" "${api[@]}"; fi
            if [ "$cert_state" = all ]; then apple_sign=true; fi
            if [ "$api_state" = all ]; then apple_notarize=api-key; elif [ "$id_state" = all ]; then apple_notarize=apple-id; fi
            if [ "$apple_notarize" != none ] && [ "$apple_sign" != true ]; then echo "::error::Notarization needs Apple code signing too: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY."; exit 1; fi
          else
            pfx=(WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD); azure=(AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_PROFILE)
            pfx_state=$(state "${pfx[@]}"); azure_state=$(state "${azure[@]}")
            if [ "$pfx_state" = partial ]; then partial "Windows certificate signing" "${pfx[@]}"; fi
            if [ "$azure_state" = partial ]; then partial "Azure Artifact Signing" "${azure[@]}"; fi
            if [ "$pfx_state" = all ] && [ "$azure_state" = all ]; then echo "::error::Both a Windows PFX certificate and Azure Artifact Signing are configured. Keep only one."; exit 1; fi
            if [ "$pfx_state" = all ]; then windows_sign=pfx; elif [ "$azure_state" = all ]; then windows_sign=azure; fi
          fi
          keys=(TAURI_SIGNING_PRIVATE_KEY METERLUMA_UPDATER_PUBKEY METERLUMA_UPDATER_ENDPOINT); updater_state=$(state "${keys[@]}")
          if [ "$updater_state" = partial ]; then partial "The updater" "${keys[@]}"; fi
          if [ "$updater_state" = all ]; then updater=true; fi
          { echo "apple_sign=$apple_sign"; echo "apple_notarize=$apple_notarize"; echo "windows_sign=$windows_sign"; echo "updater=$updater"; } >> "$GITHUB_OUTPUT"
          echo "Release configuration for $PLATFORM: apple_sign=$apple_sign apple_notarize=$apple_notarize windows_sign=$windows_sign updater=$updater"

      - name: Import the Windows signing certificate
        if: steps.signing.outputs.windows_sign == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'meterluma-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', '')))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { Write-Output '::error::WINDOWS_CERTIFICATE holds no certificate with a private key.'; exit 1 }
            Write-Output "Imported a code-signing certificate valid until $($certificate.NotAfter.ToString('yyyy-MM-dd'))."
            Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)"
          } finally { Remove-Item -Path $pfx -Force -ErrorAction SilentlyContinue }
      - name: Install artifact-signing-cli for Azure Artifact Signing
        if: steps.signing.outputs.windows_sign == 'azure'
        run: cargo install artifact-signing-cli --version 0.11.0 --locked
      - name: Write the App Store Connect API key
        if: steps.signing.outputs.apple_notarize == 'api-key'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/meterluma-notary"
          key="$RUNNER_TEMP/meterluma-notary/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Write the release config overlay
        shell: node {0}
        env:
          UPDATER: ${{ steps.signing.outputs.updater }}
          WINDOWS_SIGN: ${{ steps.signing.outputs.windows_sign }}
          UPDATER_PUBKEY: ${{ secrets.METERLUMA_UPDATER_PUBKEY }}
          UPDATER_ENDPOINT: ${{ secrets.METERLUMA_UPDATER_ENDPOINT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
        run: |
          const fs = require('fs'), path = require('path'), env = process.env;
          const fail = message => { console.log(`::error::${message}`); process.exit(1); };
          const overlay = { bundle: {} };
          if (env.UPDATER === 'true') {
            const endpoint = env.UPDATER_ENDPOINT.trim(), pubkey = env.UPDATER_PUBKEY.trim();
            let url; try { url = new URL(endpoint); } catch { fail('METERLUMA_UPDATER_ENDPOINT is not a valid URL.'); }
            if (url.protocol !== 'https:') fail('METERLUMA_UPDATER_ENDPOINT must use https.');
            if (!/^[A-Za-z0-9+/=]+$/.test(pubkey)) fail('METERLUMA_UPDATER_PUBKEY must be the one-line contents of the .key.pub file from tauri signer generate.');
            overlay.bundle.createUpdaterArtifacts = true;
            overlay.plugins = { updater: { pubkey, endpoints: [endpoint] } };
          }
          if (env.WINDOWS_SIGN === 'pfx') overlay.bundle.windows = { certificateThumbprint: env.WINDOWS_CERTIFICATE_THUMBPRINT, digestAlgorithm: 'sha256', timestampUrl: env.TIMESTAMP_URL || 'http://timestamp.digicert.com', tsp: true };
          if (env.WINDOWS_SIGN === 'azure') overlay.bundle.windows = { signCommand: { cmd: 'artifact-signing-cli', args: ['-e', env.AZURE_ENDPOINT, '-a', env.AZURE_ACCOUNT, '-c', env.AZURE_PROFILE, '-d', 'MeterLuma', '%1'] } };
          const keys = [...Object.keys(overlay.bundle).map(key => `bundle.${key}`), ...Object.keys(overlay.plugins ?? {}).map(key => `plugins.${key}`)];
          if (!keys.length) { console.log('No signing or updater overlay: building with the base tauri.conf.json.'); process.exit(0); }
          const file = path.join(env.RUNNER_TEMP, 'meterluma-release.conf.json');
          fs.writeFileSync(file, JSON.stringify(overlay, null, 2));
          fs.appendFileSync(env.GITHUB_ENV, `TAURI_RELEASE_CONFIG=${file}\n`);
          console.log(`Release overlay sets ${keys.join(', ')}.`);
      - name: Build release bundles
        shell: bash
        env:
          APPLE_SIGN: ${{ steps.signing.outputs.apple_sign }}
          APPLE_NOTARIZE: ${{ steps.signing.outputs.apple_notarize }}
          WINDOWS_SIGN: ${{ steps.signing.outputs.windows_sign }}
          UPDATER: ${{ steps.signing.outputs.updater }}
          IN_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          IN_APPLE_ID: ${{ secrets.APPLE_ID }}
          IN_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          IN_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IN_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          IN_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          IN_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Tauri treats an empty APPLE_* or TAURI_SIGNING_* variable as configured, so only export the ones in use.
          pass() { local name source_name; for name in "$@"; do source_name="IN_$name"; export "$name=${!source_name}"; done; }
          if [ "$APPLE_SIGN" = true ]; then pass APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; fi
          if [ "$APPLE_NOTARIZE" = apple-id ]; then pass APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          if [ "$APPLE_NOTARIZE" = api-key ]; then pass APPLE_API_KEY APPLE_API_ISSUER; fi
          if [ "$WINDOWS_SIGN" = azure ]; then pass AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; fi
          if [ "$UPDATER" = true ]; then pass TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          for name in "${!IN_@}"; do unset "$name"; done
          args=(build --target "$TARGET" --bundles "$BUNDLES")
          if [ -n "${TAURI_RELEASE_CONFIG:-}" ]; then args+=(--config "$TAURI_RELEASE_CONFIG"); fi
          if [ "$UPDATER" = true ]; then args+=(--features updater); fi
          echo "tauri ${args[*]} -- --locked"
          npx tauri "${args[@]}" -- --locked
      - name: Notarize and staple the DMG
        if: matrix.platform == 'macos' && steps.signing.outputs.apple_notarize != 'none'
        shell: bash
        env:
          APPLE_NOTARIZE: ${{ steps.signing.outputs.apple_notarize }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          dmgs=("src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then echo "::error::Expected one DMG, found ${#dmgs[@]}."; exit 1; fi
          if [ "$APPLE_NOTARIZE" = api-key ]; then auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"); else auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"); fi
          xcrun notarytool submit "${dmgs[0]}" "${auth[@]}" --wait --timeout 1h
          xcrun stapler staple "${dmgs[0]}"
      - name: Verify macOS bundle, signature and notarization
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_SIGN: ${{ steps.signing.outputs.apple_sign }}
          APPLE_NOTARIZE: ${{ steps.signing.outputs.apple_notarize }}
        run: |
          shopt -s nullglob
          apps=("src-tauri/target/$TARGET/release/bundle/macos/"*.app); dmgs=("src-tauri/target/$TARGET/release/bundle/dmg/"*.dmg)
          if [ "${#apps[@]}" -ne 1 ] || [ "${#dmgs[@]}" -ne 1 ]; then echo "::error::Expected one .app and one DMG, found ${#apps[@]} and ${#dmgs[@]}."; exit 1; fi
          app="${apps[0]}"; dmg="${dmgs[0]}"
          for binary in "$app"/Contents/MacOS/*; do archs=" $(lipo -archs "$binary") "; if [[ "$archs" != *" arm64 "* || "$archs" != *" x86_64 "* ]]; then echo "::error::$binary is not universal (archs:$archs)."; exit 1; fi; done
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          echo "LSMinimumSystemVersion=$minimum"
          signed=false; notarized=false
          details=$(codesign -dv --verbose=2 "$app" 2>&1 || true)
          if codesign --verify --deep --strict "$app" && grep -q '^Authority=Developer ID Application' <<<"$details"; then signed=true; fi
          if xcrun stapler validate "$app" >/dev/null 2>&1 && xcrun stapler validate "$dmg" >/dev/null 2>&1; then notarized=true; fi
          if [ "$APPLE_SIGN" = true ] && [ "$signed" != true ]; then echo "::error::Apple signing was configured, but the app is not signed with a Developer ID Application certificate."; exit 1; fi
          if [ "$APPLE_NOTARIZE" != none ] && [ "$notarized" != true ]; then echo "::error::Notarization was configured, but the app or DMG has no valid stapled ticket."; exit 1; fi
          if [ "$notarized" = true ]; then spctl --assess --type execute --verbose=2 "$app"; fi
          echo "macOS: signed=$signed notarized=$notarized"
          { echo "SIGNED=$signed"; echo "NOTARIZED=$notarized"; } >> "$GITHUB_ENV"
      - name: Verify Windows signatures
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_SIGN: ${{ steps.signing.outputs.windows_sign }}
        run: |
          $installers = @(Get-ChildItem -Path "src-tauri/target/$env:TARGET/release/bundle/nsis" -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { Write-Output "::error::Expected one NSIS installer, found $($installers.Count)."; exit 1 }
          $installer = (Get-AuthenticodeSignature -FilePath $installers[0].FullName).Status
          $binary = (Get-AuthenticodeSignature -FilePath "src-tauri/target/$env:TARGET/release/meterluma.exe").Status
          Write-Output "Installer signature: $installer. App binary signature: $binary."
          $signed = ($installer -eq 'Valid') -and ($binary -eq 'Valid')
          if ($env:WINDOWS_SIGN -ne 'none' -and -not $signed) { Write-Output '::error::Windows signing was configured, but the installer or the app binary is not validly signed.'; exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNED=$($signed.ToString().ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value 'NOTARIZED=n/a'
      - name: Collect release files
        shell: bash
        env:
          UPDATER: ${{ steps.signing.outputs.updater }}
        run: |
          shopt -s nullglob
          one() { if [ "$#" -ne 1 ]; then echo "::error::Expected exactly one file, found $#: $*" >&2; return 1; fi; printf '%s' "$1"; }
          bundle="src-tauri/target/$TARGET/release/bundle"; out="$RUNNER_TEMP/release/assets"; mkdir -p "$out"
          if [ "$PLATFORM" = windows ]; then
            installer=$(one "$bundle"/nsis/*-setup.exe); cp "$installer" "$out/"
            if [ "$UPDATER" = true ]; then signature=$(one "$bundle"/nsis/*-setup.exe.sig); cp "$signature" "$out/"; fi
          else
            dmg=$(one "$bundle"/dmg/*.dmg); cp "$dmg" "$out/"
            if [ "$UPDATER" = true ]; then
              archive=$(one "$bundle"/macos/*.app.tar.gz); signature=$(one "$bundle"/macos/*.app.tar.gz.sig)
              cp "$archive" "$out/MeterLuma_${VERSION}_universal.app.tar.gz"; cp "$signature" "$out/MeterLuma_${VERSION}_universal.app.tar.gz.sig"
            fi
          fi
          ls -l "$out"
      - name: Record build facts
        shell: bash
        env:
          UPDATER: ${{ steps.signing.outputs.updater }}
        run: node .github/scripts/release-meta.mjs platform "--out=$RUNNER_TEMP/release/platform.json" "--platform=$PLATFORM" "--target=$TARGET" "--bundles=$BUNDLES" "--assets=$RUNNER_TEMP/release/assets" "--tests=$RUNNER_TEMP/native-tests.json" "--signed=$SIGNED" "--notarized=$NOTARIZED" "--updater=$UPDATER"
      - uses: actions/upload-artifact@v7
        with:
          name: meterluma-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/meterluma-notary" "$RUNNER_TEMP/meterluma-release.conf.json" "$RUNNER_TEMP/meterluma-signing.pfx"
      - name: Remove the imported Windows certificate
        if: always() && matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE_THUMBPRINT != ''
        shell: pwsh
        run: Remove-Item -Path "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -DeleteKey -ErrorAction SilentlyContinue

  publish:
    name: Checksums, build info and draft release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
      VERIFIED_CLEAN: ${{ needs.verify.outputs.clean }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: meterluma-*
          path: ${{ runner.temp }}/downloads
      - name: Write BUILD-INFO.json, latest.json and SHA256SUMS.txt
        env:
          METERLUMA_DOWNLOAD_BASE_URL: ${{ vars.METERLUMA_DOWNLOAD_BASE_URL }}
        run: node .github/scripts/release-meta.mjs finalize "--downloads=$RUNNER_TEMP/downloads" "--out=$RUNNER_TEMP/MeterLuma-$VERSION" "--notes=$RUNNER_TEMP/release-notes.md" "--tag=$RELEASE_TAG" "--sha=$VERIFIED_SHA" "--verified-clean=$VERIFIED_CLEAN" "--interface-tests=$RUNNER_TEMP/downloads/meterluma-interface-tests/interface-tests.json"
      - name: Check the checksums
        run: cd "$RUNNER_TEMP/MeterLuma-$VERSION" && sha256sum --check --strict SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: MeterLuma-${{ needs.verify.outputs.version }}-release
          path: ${{ runner.temp }}/MeterLuma-${{ needs.verify.outputs.version }}/
          if-no-files-found: error
      - name: Create or update the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/MeterLuma-$VERSION"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then echo "::error::Release $RELEASE_TAG is already published; its files are not replaced."; exit 1; fi
            gh release upload "$RELEASE_TAG" "$dir"/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            prerelease=(); case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$RELEASE_TAG" "$dir"/* --draft --verify-tag "${prerelease[@]}" --title "MeterLuma $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
