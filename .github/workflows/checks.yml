name: Check and build MeterLuma

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: Also build and test the Windows and macOS apps (uses the most Actions minutes)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: meterluma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Versions agree across package.json, Cargo.toml and tauri.conf.json
        run: node .github/scripts/release-meta.mjs versions
      - name: Third-party notices cover every locked package
        run: node .github/scripts/release-meta.mjs notices

  interface:
    name: Interface checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check and build the release frontend
        run: npm run build
      - name: Install Chromium and WebKit
        id: browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium tests (dev server, demo available)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm test -- --output=test-results/chromium
      - name: Release-build tests (vite preview of dist, no demo)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:release -- --output=test-results/release
      - name: WebKit tests (the engine behind macOS WKWebView)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:webkit -- --output=test-results/webkit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  desktop:
    name: Desktop (${{ matrix.platform }})
    # The repository is public, so native tests run on every push to main and every pull request, and a
    # Rust regression is caught before a release tag. Installable CI bundles are built only when started
    # by hand (Actions → Check and build MeterLuma → Run workflow).
    if: github.event_name != 'workflow_dispatch' || inputs.desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
            args: --bundles nsis
          - platform: macos
            runner: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: meter-luma-${{ matrix.platform }}
      - run: npm ci
      - name: Prepare frontend assets for release-profile tests
        run: npm run build
      - name: Native tests (host)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Native tests (Intel slice under Rosetta)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then sudo softwareupdate --install-rosetta --agree-to-license; fi
          cargo test --release --manifest-path src-tauri/Cargo.toml --lib --target x86_64-apple-darwin --locked
      - name: Updater feature builds and passes its tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib --features updater --locked
      - name: Build unsigned CI bundle (not for distribution)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: npx tauri build ${{ matrix.args }} -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: MeterLuma-${{ matrix.platform }}-ci-unsigned
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/release/meterluma.exe
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
